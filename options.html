<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>PR Diff Filter 設定</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 24px; max-width: 640px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; font-family: monospace; }
    textarea { height: 160px; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>PR Diff Filter 設定</h1>
  <label>GitHub トークン（任意）</label>
  <small>private リポジトリの行数集計に必要です。repo の read 権限があれば十分です。</small>
  <input id="token" type="password">
  <label>テストコードとみなすパスの正規表現（1 行 1 つ）</label>
  <textarea id="patterns"></textarea>
  <p><button id="save">保存</button> <button id="reset">デフォルトに戻す</button> <span id="status"></span></p>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
